<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Gallery</title>

  <!-- JSZip + FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .grid img {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      object-fit: cover;
    }

    .full {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .full img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }

    /* Progress overlay */
    #progressOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-family: Inter, sans-serif;
      z-index: 9999;
    }

    #progressBox {
      background: rgba(255,255,255,0.12);
      padding: 24px 32px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      text-align: center;
      width: 260px;
    }

    #progressBar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
      margin-top: 12px;
      overflow: hidden;
    }

    #progressFill {
      height: 100%;
      width: 0%;
      background: #4fd1c5;
      border-radius: 6px;
      transition: width 0.15s ease-out;
    }
  </style>
</head>

<body style="background-image: url('bg-home.png');">

  <div class="card">
    <h1>Gallery</h1>
    <h2>Photos uploaded so far</h2>

    <div class="filter-buttons">
      <button class="btn" data-filter="welcome">Welcome Drinks</button>
      <button class="btn" data-filter="wedding">Ceremony & Reception</button>
      <button class="btn" data-filter="recovery">Recovery Drinks</button>
    </div>

    <div id="gallery" class="grid"></div>

    <button onclick="downloadAll()">Download all images</button>
  </div>

  <div id="fullView" class="full" style="display:none;" onclick="this.style.display='none'">
    <img id="fullImg">
  </div>

  <!-- Progress UI -->
  <div id="progressOverlay">
    <div id="progressBox">
      <div id="progressText">Preparing...</div>
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>
  </div>

<script>
let allPhotos = [];

// Load all photos
async function loadPhotos() {
  const res = await fetch("https://super-base-a55bevent-photo-uploader.jackson-neaves.workers.dev/list");
  allPhotos = await res.json();
}

// Render filtered photos
function renderPhotos(list) {
  const container = document.getElementById('gallery');
  container.innerHTML = '';

  list.forEach(photo => {
    const img = document.createElement('img');
    img.src = photo.url;
    img.onclick = () => openFull(photo.url);
    container.appendChild(img);
  });
}

// Filter buttons
document.querySelectorAll('.filter-buttons .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const suffix = '_' + btn.dataset.filter + '/';
    const filtered = allPhotos.filter(p => p.key.includes(suffix));
    renderPhotos(filtered);
  });
});

// Fullscreen viewer
function openFull(url) {
  document.getElementById("fullImg").src = url;
  document.getElementById("fullView").style.display = "flex";
}

// NEW: Browser-side ZIP with progress + subfolders
async function downloadAll() {
  if (!allPhotos.length) {
    alert("No photos found.");
    return;
  }

  const overlay = document.getElementById("progressOverlay");
  const text = document.getElementById("progressText");
  const fill = document.getElementById("progressFill");

  overlay.style.display = "flex";

  const zip = new JSZip();
  const total = allPhotos.length;
  let count = 0;

  await Promise.all(
    allPhotos.map(async (file) => {
      const response = await fetch(file.url);
      const blob = await response.blob();

      // Extract event folder from key
      // Example key: "brooke-davis_wedding/12345-IMG.jpg"
      const folderName = file.key.split("_")[1].split("/")[0]; // "wedding"
      const filename = file.key.split("/").pop();

      // Add to subfolder
      zip.folder(folderName).file(filename, blob);

      // Update progress
      count++;
      text.textContent = `Downloading ${count} of ${total}`;
      fill.style.width = `${(count / total) * 100}%`;
    })
  );

  text.textContent = "Creating ZIP...";

  const content = await zip.generateAsync({ type: "blob" });

  overlay.style.display = "none";
  saveAs(content, "all-photos.zip");
}

loadPhotos();
</script>

</body>
</html>
