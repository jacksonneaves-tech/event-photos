<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Gallery</title>

  <!-- JSZip + FileSaver for client-side ZIP creation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .grid img {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      object-fit: cover;
    }

    .full {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .full img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }
  </style>
</head>

<body style="background-image: url('bg-home.png');">

  <div class="card">
    <h1>Gallery</h1>
    <h2>Photos uploaded so far</h2>

    <div class="filter-buttons">
      <button class="btn" data-filter="welcome">Welcome Drinks</button>
      <button class="btn" data-filter="wedding">Ceremony & Reception</button>
      <button class="btn" data-filter="recovery">Recovery Drinks</button>
    </div>

    <div id="gallery" class="grid"></div>

    <button onclick="downloadAll()">Download all images</button>
  </div>

  <div id="fullView" class="full" style="display:none;" onclick="this.style.display='none'">
    <img id="fullImg">
  </div>

<script>
let allPhotos = [];

// Load all photos from Worker
async function loadPhotos() {
  const res = await fetch("https://super-base-a55bevent-photo-uploader.jackson-neaves.workers.dev/list");
  allPhotos = await res.json();
}

// Render filtered photos
function renderPhotos(list) {
  const container = document.getElementById('gallery');
  container.innerHTML = '';

  list.forEach(photo => {
    const img = document.createElement('img');
    img.src = photo.url;
    img.onclick = () => openFull(photo.url);
    container.appendChild(img);
  });
}

// Filter buttons
document.querySelectorAll('.filter-buttons .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const suffix = '_' + btn.dataset.filter + '/';
    const filtered = allPhotos.filter(p => p.key.includes(suffix));
    renderPhotos(filtered);
  });
});

// Fullscreen viewer
function openFull(url) {
  document.getElementById("fullImg").src = url;
  document.getElementById("fullView").style.display = "flex";
}

// NEW: Browser-side ZIP download
async function downloadAll() {
  try {
    if (!allPhotos.length) {
      alert("No photos found.");
      return;
    }

    const zip = new JSZip();

    // Download each image and add to ZIP
    await Promise.all(
      allPhotos.map(async (file) => {
        const response = await fetch(file.url);
        const blob = await response.blob();
        const filename = file.key.split("/").pop();
        zip.file(filename, blob);
      })
    );

    // Generate ZIP and trigger download
    const content = await zip.generateAsync({ type: "blob" });
    saveAs(content, "all-photos.zip");

  } catch (err) {
    console.error("ZIP error:", err);
    alert("Something went wrong while creating the ZIP.");
  }
}

loadPhotos();
</script>

</body>
</html>
